name: Publish YAML configuration bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-yaml-bundles.yml"
      - "scripts/publish_yaml_bundles.py"
      - "uvr_yaml_weights.json"
      - "models.json"
      - "uvr_source_assets.json"

permissions:
  contents: write

concurrency:
  group: msst-yaml-configuration-bundles
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install --no-cache-dir "requests>=2.31,<3"
      - name: Download YAMLs, verify hashes, package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/publish_yaml_bundles.py
